<html lang="zh">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{padding:10px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:16px;flex-shrink:0}
#header h1{font-size:15px;font-weight:700;color:#f0f6fc}
#header .sub{font-size:12px;color:#8b949e}
#header .badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.b-green{background:#1a4731;color:#3fb950}
.b-orange{background:#3d2c02;color:#e3b341}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:240px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;flex-shrink:0;padding:12px}
#sidebar h3{font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:12px}
#sidebar h3:first-child{margin-top:0}
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;color:#c9d1d9}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.event-item{padding:6px 0;border-bottom:1px solid #21262d;cursor:pointer}
.event-item:hover{background:#1c2128;margin:0 -12px;padding:6px 12px}
.event-date{font-size:10px;color:#8b949e;margin-bottom:2px}
.event-title{font-size:12px;color:#f0f6fc;font-weight:600}
.event-desc{font-size:11px;color:#8b949e;margin-top:2px;line-height:1.4}
.event-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600;margin-top:3px}
.tag-buy{background:#1a4731;color:#3fb950}
.tag-warn{background:#3d1f00;color:#f0883e}
.tag-stage{background:#1c2128;color:#8b949e}
#charts{flex:1;display:flex;flex-direction:column;padding:8px;gap:4px;overflow:hidden}
.chart-wrap{position:relative;background:#161b22;border-radius:6px;border:1px solid #21262d}
#priceWrap{flex:6}
#volWrap{flex:2}
#rsiWrap{flex:2}
.chart-label{position:absolute;top:6px;left:10px;font-size:10px;font-weight:600;color:#8b949e;z-index:10;pointer-events:none}
#tooltip{position:fixed;background:#1c2128;border:1px solid #30363d;border-radius:6px;padding:10px 12px;font-size:11px;pointer-events:none;display:none;z-index:100;min-width:200px}
#tooltip table{border-collapse:collapse;width:100%}
#tooltip td{padding:2px 4px}
#tooltip .t-date{font-size:12px;font-weight:700;color:#f0f6fc;margin-bottom:6px}
#tooltip .t-key{color:#8b949e}
#tooltip .t-val{color:#f0f6fc;font-weight:600;text-align:right}
#hoverLine{position:absolute;top:0;bottom:0;width:1px;background:rgba(139,148,158,0.4);pointer-events:none;display:none}
#infobar{height:28px;background:#161b22;border-top:1px solid #30363d;display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;color:#8b949e;flex-shrink:0}
.info-chip{color:#f0f6fc}.info-chip span{color:#8b949e;margin-right:4px}
</style>
</head>

// Event date to index map
const dateIdx = {};
labels.forEach((l, i) => { dateIdx[l] = i; });

function getIdx(date) {
  // find closest
  if (dateIdx[date] !== undefined) return dateIdx[date];
  for (let i = 0; i < labels.length; i++) {
    if (labels[i] >= date) return i;
  }
  return labels.length - 1;
}

// Stage background plugin
const stagePlugin = {
  id: 'stagePlugin',
  beforeDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.x) return;
    const xScale = scales.x;
    ctx.save();
    STAGES.forEach(s => {
      const x1 = xScale.getPixelForValue(getIdx(s.from));
      const x2 = xScale.getPixelForValue(getIdx(s.to));
      ctx.fillStyle = s.color;
      ctx.fillRect(Math.max(x1, chartArea.left), chartArea.top, Math.min(x2, chartArea.right) - Math.max(x1, chartArea.left), chartArea.bottom - chartArea.top);
    });
    ctx.restore();
  }
};

// Event line plugin
const eventPlugin = {
  id: 'eventPlugin',
  afterDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.x) return;
    const xScale = scales.x;
    EVENTS.forEach(ev => {
      const idx = getIdx(ev.date);
      const x = xScale.getPixelForValue(idx);
      if (x < chartArea.left || x > chartArea.right) return;
      ctx.save();
      ctx.strokeStyle = ev.tag === 'buy' ? 'rgba(63,185,80,0.7)' : ev.tag === 'warn' ? 'rgba(240,136,62,0.7)' : 'rgba(88,166,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
      // Small dot
      ctx.fillStyle = ev.tag === 'buy' ? '#3fb950' : ev.tag === 'warn' ? '#f0883e' : '#58a6ff';
      ctx.beginPath();
      ctx.arc(x, chartArea.top + 8, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
};

}
window.addEventListener('resize', resizeAll);
setTimeout(resizeAll, 100);

// Event list in sidebar
const evList = document.getElementById('eventList');
EVENTS.forEach(ev => {
  const div = document.createElement('div');
  div.className = 'event-item';
  const tagClass = ev.tag === 'buy' ? 'tag-buy' : ev.tag === 'warn' ? 'tag-warn' : 'tag-stage';
  const tagText = ev.tag === 'buy' ? '买点' : ev.tag === 'warn' ? '注意' : '阶段';
  div.innerHTML = `
    <div class="event-date">${ev.date}</div>
    <div class="event-title">${ev.title}</div>
    <div class="event-desc">${ev.desc.replace(/\n/g,'<br>')}</div>
    <div class="event-tag ${tagClass}">${tagText} · ${ev.layer}</div>
  `;
  div.addEventListener('click', () => {
    // Jump to that index
    const idx = getIdx(ev.date);
    updateInfobar(idx);
  });
  evList.appendChild(div);
});

// Cross-chart hover sync
function updateInfobar(idx) {
  if (idx < 0 || idx >= RAW.length) return;
  const d = RAW[idx];
  document.getElementById('infoDate').innerHTML = `<span>日期</span>${d.date}`;
  document.getElementById('infoClose').innerHTML = `<span>收盘</span>$${d.close.toFixed(2)}`;
  document.getElementById('infoMa30').innerHTML = `<span>MA150</span>$${d.ma30 ? d.ma30.toFixed(2) : '—'}`;
  const pct = d.pct_vs_ma30;
  const pctColor = pct > 25 ? '#f0883e' : pct < 0 ? '#f85149' : '#3fb950';
  document.getElementById('infoPct').innerHTML = `<span>vs MA150</span><span style="color:${pctColor}">${pct ? (pct > 0 ? '+' : '') + pct.toFixed(1) + '%' : '—'}</span>`;
  const rsiVal = d.rsi;
  const rsiColor = rsiVal > 70 ? '#f85149' : rsiVal < 30 ? '#3fb950' : '#bc8cff';
  document.getElementById('infoRSI').innerHTML = `<span>RSI</span><span style="color:${rsiColor}">${rsiVal ? rsiVal.toFixed(1) : '—'}</span>`;
  document.getElementById('infoVol').innerHTML = `<span>量比</span>${d.vol_ratio ? d.vol_ratio.toFixed(2) + 'x' : '—'}`;
}

// Mouse move handler on price chart
priceCtx.addEventListener('mousemove', (e) => {
  const points = priceChart.getElementsAtEventForMode(e, 'index', { intersect: false }, false);
  if (points.length) {
    const idx = points[0].index;
    updateInfobar(idx);
    // Sync RSI chart cursor
    [volChart, rsiChart].forEach(ch => {
      ch.canvas.dispatchEvent(new MouseEvent('mousemove', {
        clientX: e.clientX, clientY: ch.canvas.getBoundingClientRect().top + 5,
        bubbles: true
      }));
    });
  }
});

[volCtx, rsiCtx].forEach(ctx => {
  ctx.addEventListener('mousemove', (e) => {
    const chart = Chart.getChart(ctx);
    const points = chart.getElementsAtEventForMode(e, 'index', { intersect: false }, false);
    if (points.length) updateInfobar(points[0].index);
  });
});

// Stage labels on price chart - text overlay (afterDraw plugin)
// Add stage text via annotation
const stageTextPlugin = {
  id: 'stageText',
  afterDraw(chart) {
    if (chart.canvas.id !== 'priceChart') return;
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.x) return;
    const xScale = scales.x;
    const labels_map = [
      { date:'2022-03-01', text:'Stage 4', color:'rgba(240,136,62,0.6)' },
      { date:'2022-11-15', text:'Stage 1', color:'rgba(88,166,255,0.6)' },
      { date:'2023-05-01', text:'Stage 2', color:'rgba(63,185,80,0.6)' },
    ];
    ctx.save();
    labels_map.forEach(lb => {
      const idx = getIdx(lb.date);
      const x = xScale.getPixelForValue(idx);
      if (x < chartArea.left + 10 || x > chartArea.right - 10) return;
      ctx.font = 'bold 11px -apple-system, sans-serif';
      ctx.fillStyle = lb.color;
      ctx.textAlign = 'center';
      ctx.fillText(lb.text, x, chartArea.top + 18);
    });
    ctx.restore();
  }
};
// Register plugin
Chart.register(stageTextPlugin);
priceChart.update();

</script>
